name: Check skill package

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      trigger_eval:
        description: Rerun the model-based trigger eval (needs an OPENAI_API_KEY secret)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check entrypoint parity and local references
        run: python3 scripts/check.py
      - name: YouTube finder against a fake yt-dlp (offline)
        run: python3 tests/yt_tool.py
      - name: Video lesson checker rules, sources, build and audio plan
        run: python3 tests/video_check_test.py
      - name: Video checker catches all seven accuracy attacks
        run: python3 evals/make-video/attacks.py --self-test
      - name: Small-model make-video result meets its floors
        run: |
          python3 evals/make-video/results.py --self-test
          python3 evals/make-video/results.py --check
      - name: Narration voice tools against tone clips and fake engines (needs ffmpeg)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }
          python3 tests/voice_check_test.py
      - name: Trigger guard (prompt labels, committed eval results, baseline floors)
        run: |
          python3 evals/triggers/test_check.py
          python3 evals/triggers/check.py
      - name: Head-to-head runner refuses incomplete runs
        run: python3 evals/head-to-head/test_rivals.py

  journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Playwright and Chromium
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.64.1
          python3 -m playwright install --with-deps chromium
      - name: Browser journeys (flashcard deck, exam game, visual stepper, oxygen lab, video player)
        run: |
          python3 tests/flashcards_journey.py
          python3 tests/game_journey.py
          python3 tests/visual_journey.py
          python3 tests/lab_journey.py
          python3 tests/inline_journey.py
          python3 tests/video_journey.py

  trigger-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.trigger_eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the model eval and compare with the baseline floors
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::No OPENAI_API_KEY secret; the model eval is a required local step (evals/triggers/README.md)."
            exit 0
          fi
          npm install -g @openai/codex@0.163.0
          export CODEX_HOME="$RUNNER_TEMP/codex"
          mkdir -p "$CODEX_HOME"
          printenv OPENAI_API_KEY | codex login --with-api-key
          python3 evals/triggers/run.py --passes 3 --auth "$CODEX_HOME/auth.json" --out "$RUNNER_TEMP/latest.json"
          python3 evals/triggers/run.py --passes 3 --auth "$CODEX_HOME/auth.json" --prompts evals/triggers/holdout.jsonl --out "$RUNNER_TEMP/holdout.json"
          python3 evals/triggers/check.py --result "latest.json=$RUNNER_TEMP/latest.json" --result "holdout.json=$RUNNER_TEMP/holdout.json"
