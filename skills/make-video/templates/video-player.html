<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Myelinate video lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap">
<!--
  Myelinate video player. Fill it with scripts/video_check.py lesson.json --build video.html,
  or replace only the JSON in the "lesson" block below. Never hand-edit the engine.
  Lesson format: templates/video-lesson.json. With no lesson inside, the page asks for one.
-->
<style>
:root {
  --paper: #f7f3e9; --raised: #fffcf5; --sunken: #efe8d8; --ink: #16313b; --muted: #4c6269;
  --rule: #e3dccb; --rule-strong: #c9c1ad; --accent: #a54320; --teal: #165d78; --margin: #d6a78f;
  --ok: #2f6b3a; --bad: #a3261b; --scrim: rgba(247, 243, 233, .9);
  --serif: Newsreader, Georgia, 'Times New Roman', serif;
  --sans: Inter, 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --r-sm: 6px; --r: 10px; --r-lg: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1e24; --raised: #15282f; --sunken: #0b171c; --ink: #ece6d8; --muted: #a3b3b2;
    --rule: #23383f; --rule-strong: #34505a; --accent: #e8835a; --teal: #7cc0d6; --margin: rgba(232, 131, 90, .28);
    --ok: #8fd19e; --bad: #f19a8f; --scrim: rgba(15, 30, 36, .92); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1e24; --raised: #15282f; --sunken: #0b171c; --ink: #ece6d8; --muted: #a3b3b2;
  --rule: #23383f; --rule-strong: #34505a; --accent: #e8835a; --teal: #7cc0d6; --margin: rgba(232, 131, 90, .28);
  --ok: #8fd19e; --bad: #f19a8f; --scrim: rgba(15, 30, 36, .92); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Page */
.app { max-width: 1280px; margin: 0 auto; padding: 16px 16px 48px; }
.top { display: flex; align-items: flex-start; gap: 16px; justify-content: space-between; padding: 8px 0 16px; }
.top .brand { display: flex; align-items: center; gap: 8px; font: 700 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.top h1 { font: 500 clamp(26px, 4vw, 36px)/1.15 var(--serif); letter-spacing: -.02em; margin: 8px 0 4px; }
.top .sub { margin: 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.3; padding: 4px 12px; border: 1px solid var(--rule-strong); border-radius: 999px; color: var(--muted); }
.chip.warn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.vbadge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; line-height: 1.3; padding: 4px 12px; border: 1.5px solid currentColor; border-radius: 999px; }
.vbadge svg { width: 14px; height: 14px; flex: none; }
.vlines { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.quiet { background: none; border: 1px solid var(--rule-strong); border-radius: var(--r-sm); padding: 6px 12px; min-height: 36px; color: var(--ink); }
.quiet:hover { border-color: var(--ink); }
.quiet[aria-pressed="true"] { border-color: var(--ink); background: var(--sunken); font-weight: 600; }
.quiet:disabled, .primary:disabled { opacity: .5; cursor: not-allowed; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } .top { flex-direction: column; } }

/* Stage: a notebook page the lesson is written on */
.stage {
  /* The stage is a slate screen in both page themes: ink ground, cream type, one rust accent. */
  --raised: #16313b; --paper: #1c3a45; --sunken: #12282f; --ink: #f3eee2; --muted: #a9bcbc;
  --rule: #24434e; --rule-strong: #3b5c66; --accent: #ef8f63; --margin: rgba(239, 143, 99, .35); --scrim: rgba(18, 40, 47, .93);
  --ok: #8fd19e; --bad: #f19a8f;
  position: relative; aspect-ratio: 16 / 9; width: 100%; overflow: hidden; border-radius: var(--r-lg);
  background: var(--raised); color: var(--ink); border: 1px solid #0b171c; container-type: inline-size;
}
.stage .card { --raised: #fffcf5; --paper: #f7f3e9; --sunken: #efe8d8; --ink: #16313b; --muted: #4c6269; --rule: #e3dccb; --rule-strong: #c9c1ad; --accent: #a54320; --ok: #2f6b3a; --bad: #a3261b; color: var(--ink); }
.stage .card .primary { color: #fffcf5; }
.stage::before { content: ""; position: absolute; top: 0; bottom: 0; left: 5.6cqw; width: 1.5px; background: var(--margin); }
@media (max-width: 640px) { .stage { aspect-ratio: 4 / 5; } .stage::before { left: 3.4cqw; } }
/* Chrome: the same strip on every frame. Course and exam tag, topic, part, a counter that never repeats. */
.chrome { position: absolute; top: 2.2cqw; left: 8cqw; right: 4cqw; display: flex; align-items: baseline; gap: 1.4cqw; white-space: nowrap; font: 600 max(10px, 1.15cqw)/1.2 var(--sans); color: var(--muted); }
.chrome .course { flex: none; color: var(--accent); font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
.chrome .topic { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--ink); font: 500 max(12px, 1.5cqw)/1.2 var(--serif); }
.chrome .part { flex: none; letter-spacing: .04em; }
.chrome .count { flex: none; font: 500 max(10px, 1.15cqw)/1.2 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.chrome .count i { font-style: normal; color: var(--muted); }
/* The board fills the stage down to the caption band; fit() grows or shrinks its type to use the room. */
.board { position: absolute; top: 6.4cqw; left: 8cqw; right: 5cqw; bottom: 10.8cqw; display: grid; gap: 2cqw 3.5cqw; align-content: center; font-size: calc(2.5cqw * var(--fit, 1)); }
.board.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: center; }
.board .col { display: flex; flex-direction: column; gap: 1.6cqw; min-width: 0; }
@media (max-width: 640px) {
  .chrome { top: 4cqw; left: 6cqw; right: 5cqw; gap: 2.4cqw; font-size: max(10px, 2.6cqw); }
  .chrome .topic { font-size: max(12px, 3.3cqw); }
  .chrome .part { display: none; }
  .chrome .count { font-size: max(10px, 2.6cqw); }
  .board { top: 11cqw; left: 6cqw; right: 5cqw; bottom: 31cqw; font-size: calc(4.3cqw * var(--fit, 1)); gap: 4cqw; }
  .board.two { grid-template-columns: minmax(0, 1fr); align-content: center; }
  .board .col { gap: 3.4cqw; }
}
.tier { display: inline-block; vertical-align: .3em; margin-left: .7em; padding: .38em .65em .32em; border-radius: 999px; font: 700 max(9px, .9cqw)/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.tier.memorize { background: var(--accent); color: var(--raised); }
.tier.given { border: 1.5px solid var(--muted); color: var(--muted); }
@media (max-width: 640px) { .tier { font-size: max(9px, 2cqw); } }
.badge-line { display: inline-flex; align-items: center; gap: .5em; margin: 1.1em auto 0; padding: .45em .9em; border-radius: 999px; border: 1.5px solid currentColor; font: 600 max(10px, .42em)/1.25 var(--sans); text-align: left; }
.badge-line svg { width: 1.1em; height: 1.1em; flex: none; }
.lvl-checked { color: var(--ok); } .lvl-partial { color: var(--accent); } .lvl-unverified { color: var(--bad); }
.el { will-change: opacity, transform; min-width: 0; }
.el.past { color: var(--muted); }
.el.past .t-word, .el.past .s-text, .el.past .l-text { color: var(--muted); }
.mark { position: relative; display: inline; background-image: linear-gradient(var(--accent), var(--accent)); background-repeat: no-repeat; background-position: 0 100%; background-size: calc(var(--hl, 0) * 100%) .12em; padding-bottom: .06em; }
.el.hl, .el.hl .t-word, .el.hl .s-text, .el.hl .l-text { color: var(--ink); }

.e-title { text-align: center; }
.e-title .h { font: 500 3.2em/1.08 var(--serif); letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.e-title .s { font: 400 1.25em/1.3 var(--serif); font-style: italic; color: var(--muted); margin: .5em 0 0; }
.e-question { font: italic 400 1.75em/1.25 var(--serif); letter-spacing: -.01em; text-wrap: balance; padding-left: .9em; border-left: .16em solid var(--accent); }
.e-term { display: grid; gap: .15em; }
.e-term .t-word { font: 500 1.45em/1.15 var(--serif); letter-spacing: -.015em; }
.e-term .t-mean { color: var(--muted); font-size: 1em; line-height: 1.35; }
.e-label { display: flex; gap: .6em; align-items: baseline; font-weight: 600; font-size: 1.2em; line-height: 1.3; }
.e-label::before { content: ""; width: .45em; height: .45em; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-.1em); }
.e-equation { font: 400 2em/1.3 var(--serif); text-align: center; padding: .4em .6em; background: var(--sunken); border-radius: var(--r); }
.e-equation sub, .e-equation sup, .s-text sub, .s-text sup { font-size: .62em; }
.steps { display: grid; gap: .7em; counter-reset: st; }
.e-step { display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: .6em; align-items: baseline; font-size: 1.15em; line-height: 1.3; }
.e-step::before { counter-increment: st; content: counter(st); font: 500 1.15em/1 var(--serif); color: var(--accent); }
.e-arrow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: .6em; }
.e-arrow .node { padding: .55em .8em; border: 1.5px solid var(--rule-strong); border-radius: var(--r); background: var(--paper); text-align: center; font-weight: 600; line-height: 1.25; }
.e-arrow .node.to { border-color: var(--ink); }
.e-arrow .via { display: grid; justify-items: center; gap: .2em; min-width: 5em; }
.e-arrow .via span { font-size: .82em; color: var(--muted); text-align: center; line-height: 1.2; }
.e-arrow svg { width: 5em; height: 1.2em; overflow: visible; }
.e-arrow path { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.e-compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.4em; }
.e-compare .cs h3 { margin: 0 0 .5em; font: 700 .72em/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.e-compare .cs.r h3 { color: var(--accent); }
.e-compare ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .45em; }
.e-compare li { font-size: 1.1em; line-height: 1.3; padding-top: .45em; border-top: 1px solid var(--rule-strong); }
.e-compare .cs.l li { color: var(--muted); }
.e-quote { margin: 0; }
.e-quote blockquote { margin: 0; font: italic 400 1.6em/1.3 var(--serif); text-wrap: pretty; }
.e-quote blockquote::before { content: "\201C"; color: var(--accent); margin-right: .05em; }
.e-quote blockquote::after { content: "\201D"; color: var(--accent); }
.e-quote figcaption { margin-top: .5em; font-size: .85em; color: var(--muted); }
.e-image { margin: 0; display: grid; gap: .4em; }
.e-image .frame { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; display: grid; place-items: center; aspect-ratio: 16 / 10; }
.e-image img { width: 100%; height: 100%; object-fit: contain; display: block; }
.e-image .alt { padding: 1em; color: var(--muted); font-style: italic; text-align: center; }
.e-image figcaption { font-size: .78em; color: var(--muted); line-height: 1.3; }
.e-graph svg { width: 100%; height: auto; overflow: visible; display: block; }
.e-graph .g-title { font: 600 .95em/1.2 var(--sans); margin: 0 0 .3em; }
.e-graph text { fill: var(--muted); font: 400 11px var(--sans); }
.e-graph .axis { stroke: var(--rule-strong); stroke-width: 1; }
.e-graph .grid { stroke: var(--rule); stroke-width: 1; }
.e-graph .line { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.e-graph .dot { fill: var(--raised); stroke: var(--ink); stroke-width: 2; }
.e-graph .mk { fill: var(--accent); }
.e-graph .mk-label { fill: var(--accent); font-weight: 600; }
.e-table { width: 100%; border-collapse: collapse; font-size: 1.05em; font-variant-numeric: tabular-nums; }
.e-table caption { text-align: left; font: 600 .8em/1.2 var(--sans); color: var(--muted); padding-bottom: .5em; }
.e-table th { font: 700 .6em/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 0 0 .55em .9em; border-bottom: 1.5px solid var(--rule-strong); }
.e-table td { text-align: right; padding: .4em 0 .4em .9em; border-bottom: 1px solid var(--rule); line-height: 1.25; }
.e-table th:first-child, .e-table td:first-child { text-align: left; padding-left: 0; }
.e-table td:first-child { font-weight: 600; }
.e-table tr.past td { color: var(--muted); }
.e-table sub, .e-table sup { font-size: .62em; }
.e-bars { display: grid; gap: .5em; }
.e-bars .b-title { font: 600 .8em/1.2 var(--sans); color: var(--muted); margin: 0 0 .2em; }
.e-bars .b { display: grid; grid-template-columns: minmax(0, 6.5em) minmax(0, 1fr) 4.2em; gap: .7em; align-items: center; }
.e-bars .b-label { font-weight: 600; line-height: 1.2; text-align: right; }
.e-bars .b-track { height: 1.15em; border-radius: .2em; background: var(--sunken); overflow: hidden; }
.e-bars .b-fill { display: block; height: 100%; width: 0; border-radius: .2em; background: var(--ink); }
.e-bars .b.hl .b-fill { background: var(--accent); }
.e-bars .b-val { font: 500 .9em/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

/* Captions: a band right under the board, one short chunk at a time, never over the drawing */
.cap { position: absolute; left: 8cqw; right: 5cqw; bottom: 1.3cqw; height: 9cqw; display: flex; flex-direction: column; justify-content: flex-end; gap: .7cqw; border-top: 1px solid var(--rule); }
.cap p { margin: 0; font: 500 max(14px, 2.05cqw)/1.32 var(--sans); max-width: 58ch; user-select: text; text-wrap: balance; }
.cap .w { color: var(--muted); transition: color .12s; }
.cap .w.on { color: var(--ink); }
.srcline { display: flex; flex-wrap: wrap; align-items: center; gap: .3em 1em; min-height: 1.3em; font: 400 max(11px, 1.25cqw)/1.3 var(--sans); color: var(--muted); }
.srcline a { color: inherit; text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 2px; }
.srcline .flag { display: inline-flex; align-items: center; gap: .45em; padding: .15em .7em; border: 1.5px solid var(--accent); border-radius: 999px; color: var(--accent); font-weight: 600; }
.nocap .cap p { visibility: hidden; }
@media (max-width: 640px) { .cap { left: 6cqw; right: 5cqw; bottom: 3cqw; height: 26cqw; gap: 1.6cqw; } .cap p { font-size: max(15px, 4.4cqw); } .srcline { font-size: max(11px, 2.8cqw); } }
/* While a question is open the board is covered: the answer can't be read off the screen. */
.stage.covered .board, .stage.covered .cap, .stage.covered .chrome .topic { visibility: hidden; }
.stage.covered .overlay { background: var(--raised); }

/* Overlays: start, pause questions, your turn */
.overlay { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 3cqw; overflow: auto; }
.overlay[hidden] { display: none; }
.card { width: min(560px, 100%); background: var(--raised); border: 1px solid var(--rule-strong); border-radius: var(--r-lg); padding: 24px; display: grid; gap: 16px; }
.card .kicker { font: 700 12px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0; }
.card h2 { font: 500 24px/1.25 var(--serif); letter-spacing: -.015em; margin: 0; text-wrap: balance; }
.card p { margin: 0; }
.card ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.card .meta { color: var(--muted); font-size: 14px; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; padding: 12px 16px; border: 1.5px solid var(--rule-strong); border-radius: var(--r); background: var(--paper); display: flex; gap: 12px; align-items: baseline; min-height: 48px; }
.choice kbd { font: 500 12px/1 var(--mono); color: var(--muted); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 3px 6px; }
.choice:hover { border-color: var(--ink); }
.choice.right { border-color: var(--ok); }
.choice.wrong { border-color: var(--bad); }
textarea { width: 100%; max-width: 100%; min-height: 88px; resize: vertical; padding: 12px; border: 1.5px solid var(--rule-strong); border-radius: var(--r); background: var(--paper); line-height: 1.45; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.primary { background: var(--accent); color: var(--raised); border: 0; border-radius: var(--r-sm); padding: 10px 20px; min-height: 44px; font-weight: 600; }
:root[data-theme="dark"] .primary { color: #0f1e24; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .primary { color: #0f1e24; } }
.primary:hover { filter: brightness(1.06); }
.link { background: none; border: 0; padding: 8px 4px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-height: 36px; }
.verdict { padding: 12px 16px; border-radius: var(--r); background: var(--sunken); display: grid; gap: 4px; }
.verdict b { font-weight: 600; }
.verdict.ok b { color: var(--ok); }
.verdict.no b { color: var(--bad); }
.verdict .src { font-size: 13px; color: var(--muted); }
.start-play { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.start-play svg { width: 24px; height: 24px; margin-left: 3px; fill: currentColor; }
@media (max-width: 640px) { .card { padding: 16px; gap: 12px; } .card h2 { font-size: 20px; } .overlay { place-items: start center; } }

/* Control bar */
.bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 12px 0 0; }
.btn-play { width: 44px; height: 44px; border-radius: 50%; padding: 0; display: grid; place-items: center; }
.btn-play svg { width: 18px; height: 18px; fill: currentColor; }
.track { position: relative; height: 24px; display: flex; gap: 3px; align-items: center; cursor: pointer; touch-action: none; }
.seg { position: relative; height: 6px; flex: 1 1 0; background: var(--rule); border-radius: 3px; overflow: hidden; }
.seg i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); }
.seg.cur { height: 8px; }
.pdot { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--raised); border: 2px solid var(--accent); pointer-events: none; }
.pdot.done { background: var(--accent); }
.time { font: 500 13px/1 var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 4px; }
.tool { min-width: 40px; min-height: 40px; padding: 0 8px; border: 1px solid transparent; border-radius: var(--r-sm); background: none; color: var(--muted); font-size: 13px; font-weight: 600; }
.tool:hover { color: var(--ink); border-color: var(--rule-strong); }
.tool[aria-pressed="true"] { color: var(--ink); border-color: var(--rule-strong); background: var(--sunken); }
.tool select { border: 0; background: none; font-weight: 600; color: inherit; padding: 8px 4px; }
label.tool { display: inline-flex; align-items: center; }
@media (max-width: 640px) { .bar { grid-template-columns: auto minmax(0, 1fr) auto; } .tools { grid-column: 1 / -1; } }

/* Side panel */
.side { background: var(--raised); border: 1px solid var(--rule-strong); border-radius: var(--r-lg); min-width: 0; display: flex; flex-direction: column; max-height: calc(100vh - 32px); position: sticky; top: 16px; }
@media (max-width: 960px) { .side { position: static; max-height: none; } }
.tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--rule); }
.tab { flex: 1; min-height: 40px; border: 0; background: none; border-radius: var(--r-sm); color: var(--muted); font-weight: 600; font-size: 14px; }
.tab[aria-selected="true"] { background: var(--sunken); color: var(--ink); }
.panel { padding: 8px; overflow: auto; }

    html = `<div class="card"><p class="kicker">One like it · pause and solve</p><h2>${esc(p.ask)}</h2>${shown ? `<div class="verdict"><b>${math(p.answer)}</b>${(p.steps || []).length ? `<ol>${p.steps.map(s => `<li>${math(s)}</li>`).join('')}</ol>` : ''}</div>` : ''}</div>`;
  } else if (end && end.what === 'credits') {
    const names = [...new Set((L.claims || []).map(c => String(c.source || c.file || '').trim()).filter(Boolean))];
    html = `<div class="card"><p class="kicker">Sources and checks</p><p>${badgeHTML(V, 'vbadge')}</p>${V.lines.length ? `<p class="meta">${esc(V.lines.join(' · '))}</p>` : ''}${names.length ? `<ul>${names.slice(0, 6).map(n => `<li>${esc(n)}</li>`).join('')}${names.length > 6 ? `<li>and ${names.length - 6} more</li>` : ''}</ul>` : ''}<p class="meta">${esc(voiceCredit())} Made with Myelinate.</p></div>`;
  }
  if (ov.dataset.html !== html) {
    ov.dataset.html = html; ov.innerHTML = html; ov.hidden = !html;
    const card = ov.querySelector('.card'), room = $('#stage').clientHeight * 0.9;
    if (card) for (let f = 1; f > 0.5; f -= 0.05) { card.style.setProperty('--cf', f.toFixed(2)); if (card.offsetHeight <= room) break; }
  }
  ov.hidden = !html;
  cover(!!html);
}

// ---------- UI wiring ----------
function selectTab(k) {
  ['ch', 'tr', 'so'].forEach(x => { $('#tab-' + x).setAttribute('aria-selected', String(x === k)); $('#p-' + x).hidden = x !== k; });
}
function showClaim(id) {
  selectTab('so');
  const n = document.getElementById('claim-' + id);
  if (n) { n.scrollIntoView({block: 'nearest'}); n.classList.add('flash'); setTimeout(() => n.classList.remove('flash'), 1600); }
}
function wire() {
  $('#play').onclick = () => { if (!st.started) { play(); return; } toggle(); };
  $('#cc').onclick = () => { st.captions = !st.captions; $('#cc').setAttribute('aria-pressed', String(st.captions)); $('#stage').classList.toggle('nocap', !st.captions); };
  $('#voice').onclick = () => { if (!st.voice && !hasVoice()) return; setVoice(!st.voice); st.spoken = -1; };
  $('#speed').onchange = e => { st.speed = +e.target.value; st.spoken = -1; stopVoice(); };
  ['ch', 'tr', 'so'].forEach(k => $('#tab-' + k).onclick = () => selectTab(k));
  document.addEventListener('click', e => {
    const c = e.target.closest('[data-claim]'); if (c) { e.preventDefault(); showClaim(c.dataset.claim); return; }
    const j = e.target.closest('[data-t]'); if (j && T) { seek(+j.dataset.t); if (!st.playing) play(); return; }
    const en = e.target.closest('[data-end]'); if (en && T) { pause(); renderAt(T.duration); finish(); }
  });
  const track = $('#track');
  const at = x => { const r = track.getBoundingClientRect(); const f = clamp((x - r.left) / r.width); const segs = T.chapters.length, i = Math.min(segs - 1, Math.floor(f * segs)); const ch = T.chapters[i]; return ch.start + (f * segs - i) * (ch.end - ch.start); };
  let drag = false;
  track.addEventListener('pointerdown', e => { drag = true; track.setPointerCapture(e.pointerId); seek(at(e.clientX)); });
  track.addEventListener('pointermove', e => { if (drag) seek(at(e.clientX)); });
  track.addEventListener('pointerup', () => { drag = false; });
  track.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { stepSentence(1); e.preventDefault(); } if (e.key === 'ArrowLeft') { stepSentence(-1); e.preventDefault(); } });
  document.addEventListener('keydown', e => {
    if (!T || e.target.closest('textarea, input, select') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (st.pauseOpen && /^[1-5]$/.test(k)) { const b = document.querySelector(`.choice[data-i="${+k - 1}"]`); if (b && !b.disabled) b.click(); return; }
    if (k === ' ' || k === 'k') { if (e.target.closest('button')) return; e.preventDefault(); if (!st.started) play(); else toggle(); }
    else if ((k === 'arrowright' || k === 'l') && e.target !== track) { e.preventDefault(); stepSentence(1); }
    else if ((k === 'arrowleft' || k === 'j') && e.target !== track) { e.preventDefault(); stepSentence(-1); }
    else if (k === 'c') $('#cc').click();
    else if (k === 'm') $('#voice').click();
    else if (k === 't') selectTab('tr');
  });
  $('#theme').onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('myelinate-theme', document.documentElement.dataset.theme); } catch (e) {}
  };
  $('#load-other').onclick = () => { pause(); showLoader(); };
  addEventListener('resize', () => { if (!T) return; const ch = T.chapters[st.scene]; if (ch) { st.scene = -1; renderAt(st.t); } placeDots(); });
}
function showLoader(msg) {
  $('#top').hidden = true; $('#main').hidden = true; $('#loader').hidden = false;
  if (msg) $('#paste-err').textContent = msg;
  $('#paste-go').onclick = () => {
    const r = parseLesson($('#paste').value);
    if (r.err) { $('#paste-err').textContent = r.err; return; }
    const p = validate(r.d);
    if (p.length) { $('#paste-err').textContent = p.join('\n'); return; }
    start(r.d);
  };
  $('#file').onchange = async e => { const f = e.target.files[0]; if (f) { $('#paste').value = await f.text(); $('#paste-go').click(); } };
}
function start(d) {
  L = d; claimsById = {}; (L.claims || []).forEach(c => { claimsById[c.id] = c; });
  V = verify(L);
  T = build(L);
  st.t = 0; st.scene = -1; st.sayIdx = -1; st.chunk = ''; st.srcKey = null; st.answered = {}; st.results = {}; st.started = false; st.playing = false;
  kk.urls = {};
  $('#loader').hidden = true; $('#top').hidden = EXPORT; $('#main').hidden = false;
  renderStatic();
  renderAt(0);
  // Web fonts can land after the first fit; fit the board again once they have.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (L === d) { st.scene = -1; renderAt(st.t); } });
  if (EXPORT) { document.body.classList.add('export'); $('#overlay').hidden = true; return; }
  initVoice();
  startCard();
  placeDots();
  if (!raf) raf = requestAnimationFrame(loop);
}

// For tests, the checker and the MP4 export.
window.__video = {
  get lesson() { return L; }, get state() { return {t: st.t, playing: st.playing, scene: st.scene, answered: {...st.answered}, results: {...st.results}, voice: st.voice, pauseOpen: st.pauseOpen ? st.pauseOpen.id : null}; },
  get duration() { return T ? T.duration : 0; },
  timeline: () => T ? T.items.map(i => ({kind: i.kind, what: i.what || null, start: +i.start.toFixed(3), dur: +i.dur.toFixed(3), text: i.text || null, key: i.key || null, scene: i.si == null ? null : i.si, claims: i.claims || null})) : [],
  get verification() { return V ? {...V} : null; },
  hash: d => lessonHash(d || L), canonical: d => { const b = {}; Object.keys(d || L).forEach(k => { if (k !== 'verification') b[k] = (d || L)[k]; }); return canon(b); },
  ttsText: s => ttsText(s),
  renderAt, seek: t => seek(t), play, pause, fnv,
  audit() {
    const problems = [], fill = [], doc = document.documentElement, counters = [];
    if (doc.scrollWidth > doc.clientWidth + 1) problems.push(`page scrolls sideways (${doc.scrollWidth} > ${doc.clientWidth})`);
    const save = st.t;
    T.chapters.forEach(ch => {
      renderAt(ch.end - 0.01);
      const b = $('#board'), cap = $('#cap'), chrome = $('#chrome');
      if (b.scrollHeight > b.clientHeight + 4) problems.push(`chapter ${ch.si + 1} overflows the stage`);
      if (+b.dataset.fit < 0.6) problems.push(`chapter ${ch.si + 1} had to shrink its text below 60%`);
      const br = b.getBoundingClientRect(), cr = cap.getBoundingClientRect(), hr = chrome.getBoundingClientRect();
      if (br.bottom > cr.top + 1) problems.push(`chapter ${ch.si + 1}: the board runs into the caption band`);
      if (hr.bottom > br.top + 1) problems.push(`chapter ${ch.si + 1}: the board runs into the top strip`);
      if (hr.right > $('#stage').getBoundingClientRect().right + 1) problems.push(`chapter ${ch.si + 1}: the top strip is wider than the stage`);
      const used = Math.max(0, ...[...b.children].map(c => c.scrollHeight));
      fill.push({chapter: ch.si + 1, fit: +b.dataset.fit, height: +(used / b.clientHeight).toFixed(2)});
      counters.push($('#ch-count').textContent.trim());
    });
    // Captions: no chunk may need more than two lines.
    T.says.forEach((it, i) => {
      it.chunks.forEach(([a]) => {
        renderAt(it.start + it.at[a] * it.speak + 0.01);
        const p = $('#cap-text'), lh = parseFloat(getComputedStyle(p).lineHeight) || 20;
        if (p.getBoundingClientRect().height > lh * 2 + 2) problems.push(`sentence ${i + 1}: a caption chunk runs over two lines`);
      });
    });
    if (new Set(counters).size !== counters.length) problems.push('the scene counter repeats: ' + counters.join(', '));
    renderAt(save);
    return {ok: problems.length === 0, problems, fill, counters};
  }
};
try { const th = localStorage.getItem('myelinate-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');
wire();
const embedded = readEmbedded();
if (embedded && !location.hash.includes('load')) start(embedded); else showLoader();
})();
</script>
